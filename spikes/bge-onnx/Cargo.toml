[package]
name = "bge-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"

[profile.release]
debug = true
