name: Release

# 发布入口：GitHub Releases UI 建草稿（写 markdown 更新日志）→ Publish 触发构建
on:
  release:
    types: [published]

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Update version from release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''
          Write-Host "Building version: $version"

          # tauri.conf.json（唯一权威，产物版本）
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw
          $tauriConf = $tauriConf -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content "src-tauri/tauri.conf.json" $tauriConf -Encoding UTF8 -NoNewline

          # Cargo.toml（crate 元数据）
          $cargoToml = Get-Content "src-tauri/Cargo.toml" -Raw
          $cargoToml = $cargoToml -replace '(?m)^version = "[^"]+"', "version = `"$version`""
          Set-Content "src-tauri/Cargo.toml" $cargoToml -Encoding UTF8 -NoNewline

          # package.json（保持一致）
          $pkg = Get-Content "package.json" -Raw
          $pkg = $pkg -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content "package.json" $pkg -Encoding UTF8 -NoNewline

          Write-Host "Version files updated to $version"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.tag_name }}
          # 每个资产上传重试 3 次，兜底 GitHub 资产接口的瞬时异常响应
          retryAttempts: 3

      - name: Generate and upload latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 原生命令（gh）非零退出时立即失败，避免静默生成错误的 latest.json
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''

          # release body 经 gh CLI 读取，避免把多行内容直接插进脚本
          # 注意：gh 多行输出会被 PowerShell 拆成 string[]，必须 join 回单字符串——
          # latest.json 的 notes 是 string，数组会让 tauri-plugin-updater 反序列化失败
          $body = ((gh release view $tag --json body -q .body) -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "## 更新内容`n- 版本 $tag"
          }
          $pubDate = gh release view $tag --json publishedAt -q .publishedAt

          # 安装包与签名文件（.sig 与安装包同目录）
          $nsisPkg = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msiPkg = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsisPkg -or -not $msiPkg) {
            Write-Error "Installer artifacts not found"
            exit 1
          }
          $nsisSig = (Get-Content "$($nsisPkg.FullName).sig" -Raw).Trim()
          $msiSig = (Get-Content "$($msiPkg.FullName).sig" -Raw).Trim()

          $nsisUrl = "https://github.com/lhf2003/custom-tools/releases/download/$tag/$($nsisPkg.Name)"
          $msiUrl = "https://github.com/lhf2003/custom-tools/releases/download/$tag/$($msiPkg.Name)"

          $json = [ordered]@{
            version   = $version
            notes     = $body
            pub_date  = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $nsisSig
                url       = $nsisUrl
              }
              "windows-x86_64-msi" = @{
                signature = $msiSig
                url       = $msiUrl
              }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content "latest.json" -Encoding UTF8
          Write-Host "latest.json generated with notes for $tag"

          # --clobber 覆盖 tauri-action 可能上传的同名 asset，保证 notes 生效
          # uploads.github.com 偶发瞬时 404（v0.5.7 曾因此发布失败），重试 3 次兜底；
          # $PSNativeCommandUseErrorActionPreference 下 gh 失败会抛异常，必须 try/catch
          $uploaded = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              gh release upload $tag "latest.json" --clobber
              $uploaded = $true
              break
            } catch {
              Write-Host "latest.json upload attempt $i failed: $($_.Exception.Message)"
              if ($i -lt 3) { Start-Sleep -Seconds 20 }
            }
          }
          if (-not $uploaded) {
            Write-Error "latest.json upload failed after 3 attempts"
            exit 1
          }
