<!DOCTYPE html>
<!-- popup.html — D13: 纯状态仪表盘, 不做搜索框（搜索唯一入口是启动器） -->
<!-- 2026-09-02 重构: 最近索引为主角, 条目可点击打开原页; 统计卡片/¥0 宣传语/黑名单/清空按钮移出（管理在主程序「记忆设置」, SQLite 是真源） -->
<!-- 视觉: 对齐 DESIGN.md token（扩展无共享样式表, hex 为 token 值直引；violet 点缀已退出, 用 signal-indigo 系） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #1e1e21; /* surface-base */
      color: #f4f4f5;      /* ink-primary */
      padding: 12px;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .brand img { width: 24px; height: 24px; border-radius: 8px; }
    .badge {
      font-size: 12px; padding: 4px 10px; border-radius: 12px; /* rounded-lg */
      border: 1px solid #ffffff1a; /* scrim-white-10 */
    }
    .badge.on  { color: #22c55e; background: #22c55e1f; border-color: #22c55e4d; } /* status-success */
    .badge.off { color: #f87171; background: #f871711f; border-color: #f871714d; } /* status-error-text */

    .section-title { font-size: 12px; color: #a1a1aa; margin: 12px 0 6px; } /* ink-tertiary */
    .header + .section-title { margin-top: 0; }

    /* 最近索引条目: 整行可点击（<a>), hover 灰阶抬一档 + ↗ 浮现 */
    .entry-row {
      position: relative;
      display: block;
      background: #2e2e33; /* surface-card */
      border: 1px solid #ffffff0d; /* scrim-white-5 */
      border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
      color: inherit; text-decoration: none; cursor: pointer;
      transition: background 150ms ease-out;
    }
    .entry-row:hover { background: #38383e; } /* surface-elevated */
    .entry-row .go {
      position: absolute; top: 9px; right: 10px;
      width: 12px; height: 12px;
      color: #a1a1aa; /* ink-tertiary */
      opacity: 0; transition: opacity 150ms ease-out;
      pointer-events: none;
    }
    .entry-row:hover .go { opacity: 1; }
    .v-title {
      font-size: 14px; color: #f4f4f5; /* body 档: 列表主角 */
      padding-right: 18px; /* 给 ↗ 留位 */
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 格子进度条：单行固定 36 格，长视频按比例压缩（LHF 定案） */
    .grid-progress { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .grid-progress .cells { display: flex; gap: 2px; flex: 1; }
    .grid-progress .cells i {
      flex: 1; height: 6px; border-radius: 6px; /* rounded-sm: 与格同高 → 胶囊形 */
      background: #ffffff1a; /* scrim-white-10 */
    }
    .grid-progress .cells i.on { background: #818cf8; } /* signal-indigo-light */
    .grid-progress .pct {
      font-size: 12px; color: #a1a1aa; flex-shrink: 0; min-width: 36px; text-align: right;
    }
    .v-stats {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #a1a1aa; margin-top: 6px; /* ink-tertiary */
    }
    .v-status.done { color: #22c55e; }   /* status-success */
    .v-status.failed { color: #f87171; } /* status-error-text */

    .domain-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #2e2e33; /* surface-card */
      border: 1px solid #ffffff0d; /* scrim-white-5 */
      border-radius: 8px; padding: 8px 12px; font-size: 12px;
      gap: 8px;
    }
    .domain-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .domain-row .actions button {
      flex-shrink: 0;
      font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer;
      border: 1px solid #ffffff1a; background: transparent; color: #f4f4f5;
    }
    .domain-row .actions button:hover { background: #ffffff0d; }
    .domain-row .actions button:disabled { color: #71717a; cursor: not-allowed; } /* ink-disabled */

    .btn-block {
      width: 100%; padding: 8px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid #6366f166; /* signal-indigo */
      background: #6366f126; color: #c7d2fe;
      font-size: 14px; margin-top: 12px;
    }
    .btn-block:hover { background: #6366f140; }
    .btn-block:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty { font-size: 12px; color: #a1a1aa; text-align: center; padding: 6px 0; } /* ink-tertiary: 对比度 6.4:1 过 AA */

    /* 键盘焦点可见（DESIGN: 不得 outline:none 后无替代） */
    button:focus-visible, .entry-row:focus-visible {
      outline: 1px solid #6366f1; /* signal-indigo */
      outline-offset: 1px;
    }

    /* prefers-reduced-motion: 过渡即时化 */
    @media (prefers-reduced-motion: reduce) {
      .entry-row, .entry-row .go { transition: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="">
      <span>Nervis 记忆</span>
    </div>
    <span id="conn" class="badge off">未连接</span>
  </div>

  <div class="section-title">最近索引</div>
  <div id="pageBox"><div class="empty" id="pageLoading">加载中…</div></div>

  <div class="section-title">当前站点</div>
  <div class="domain-row">
    <span id="curDomain">-</span>
    <div class="actions"><button id="btnBlock">不再索引此站点</button></div>
  </div>

  <button class="btn-block" id="btnOpenMemory" title="聚焦 Nervis 主窗（Alt+Space 随时检索）">打开记忆库</button>

  <script src="popup.js"></script>
</body>
</html>
