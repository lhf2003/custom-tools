[project]
name = "nervis-wemm-sidecar"
version = "0.1.0"
description = "nervis 记忆检索二期 WeMM 多模态 embedding sidecar"
requires-python = ">=3.11,<3.14"
dependencies = [
    # CUDA 12.8 构建（RTX 50 系 Blackwell 需要），走下方 pytorch-cu128 专用源
    "torch==2.8.0",
    # 缺失时 transformers video processor 静默注册为 None（N0 坑2），必须显式声明
    # 注意对应关系：torch 2.8 ↔ torchvision 0.23（不是 0.28，后者是 torch 2.13 的搭档）
    "torchvision==0.23.0",
    # 钉版：WeMM 官方验证版本（N0 复现环境）
    "transformers==5.2.0",
    # 视频解码用 PyAV 顺序解码（MediaRecorder webm 元数据残缺，decord 帧索引路线必炸）
    "av==18.1.0",
    "qwen-vl-utils==0.0.14",
    "accelerate>=1.1.0",
    "pillow",
    "numpy",
]

[tool.uv]
# 国内镜像（uv sync 走清华 PyPI）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
# torch/torchvision 必须 cu128 构建：PyPI/清华的 Windows wheel 只有 +cpu，装错触发 gpu_required；
# 阿里云 pytorch-wheels 不是 simple 布局（包页 404），索引源形式不可解析——用仓库内本地 wheel（N1 起即如此，见 uv.lock）
torch = { path = "wheels/torch-2.8.0+cu128-cp313-cp313-win_amd64.whl" }
torchvision = { path = "wheels/torchvision-0.23.0+cu128-cp313-cp313-win_amd64.whl" }
