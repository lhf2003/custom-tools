[package]
name = "nervis-memory"
version = "0.1.0"
edition = "2021"
description = "多模态记忆检索: embedding 引擎 + sqlite-vec 向量库 + memory-host 二进制"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.30", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1.9"
chrono = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "5.0"

[[bin]]
name = "memory-host"
path = "src/bin/memory-host.rs"

[[bin]]
name = "memory-backfill"
path = "src/bin/memory-backfill.rs"
